<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE Predictor Pro | Precision Engine</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.98);
            --primary: #1e293b;
            --accent: #2563eb;
            --safe: #059669;
            --target: #d97706;
            --dream: #dc2626;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(45deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--primary);
        }

        .container {
            background: var(--glass);
            padding: 35px;
            border-radius: 28px;
            width: 95%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 1.6rem; margin: 0; font-weight: 800; color: #0f172a; }
        
        .form-group { margin-bottom: 18px; }
        label { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: #64748b; margin-bottom: 6px; display: block; }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            font-size: 1rem;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        input:focus { border-color: var(--accent); outline: none; }

        button {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .results-area { margin-top: 25px; display: none; border-top: 2px solid #f1f5f9; padding-top: 20px; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #f8fafc; padding: 12px; border-radius: 12px; text-align: center; border: 1px solid #e2e8f0; }
        .stat-val { font-size: 1.1rem; font-weight: 800; color: var(--accent); }

        .college-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #fff;
            margin-bottom: 8px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        .badge { font-size: 0.7rem; padding: 4px 10px; border-radius: 20px; font-weight: 800; color: white; }
        .badge-safe { background: var(--safe); }
        .badge-target { background: var(--target); }
        .badge-dream { background: var(--dream); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Predictor Pro <span style="color: var(--accent)">v2.1</span></h1>
    </div>

    <div class="form-group">
        <label>Input Type</label>
        <select id="inputType">
            <option value="marks">NTA Score (0-300)</option>
            <option value="rank">CRL Rank</option>
        </select>
    </div>

    <div class="form-group">
        <label>Value</label>
        <input type="number" id="userInput" placeholder="Enter score/rank">
    </div>

    <div class="form-group">
        <label>Category</label>
        <select id="userCat">
            <option value="1">General</option>
            <option value="2.8">OBC-NCL</option>
            <option value="6.5">SC/ST</option>
        </select>
    </div>

    <button onclick="runAnalysis()">Run Prediction</button>

    <div class="results-area" id="results">
        <div class="stat-grid">
            <div class="stat-card"><div>Percentile</div><div class="stat-val" id="resPercentile">-</div></div>
            <div class="stat-card"><div>Est. Rank</div><div class="stat-val" id="resRank">-</div></div>
        </div>
        <div id="collegeList"></div>
    </div>
</div>

<script>
    function calculatePercentile(m) {
        if (m >= 290) return 99.99;
        if (m >= 250) return 99.7 + (m - 250) * 0.007;
        if (m >= 200) return 98.5 + (m - 200) * 0.024;
        if (m >= 150) return 95 + (m - 150) * 0.07;
        if (m >= 100) return 85 + (m - 100) * 0.2;
        if (m >= 50) return 60 + (m - 50) * 0.5;
        return m * 1.2;
    }

    function runAnalysis() {
        const type = document.getElementById('inputType').value;
        const val = parseFloat(document.getElementById('userInput').value);
        const catMultiplier = parseFloat(document.getElementById('userCat').value);
        
        let crl, percentile;
        const totalCandidates = 1500000;

        if (type === 'marks') {
            percentile = calculatePercentile(val);
            crl = Math.round((100 - percentile) * totalCandidates / 100);
        } else {
            crl = val;
            percentile = 100 - (crl / totalCandidates) * 100;
        }

        document.getElementById('resPercentile').innerText = percentile.toFixed(2) + "%";
        document.getElementById('resRank').innerText = crl.toLocaleString();
        document.getElementById('results').style.display = 'block';

        const db = [
            { name: "IIT Top 5 (Adv Required)", rank: 3000 },
            { name: "NIT Trichy/Surathkal CS", rank: 6000 },
            { name: "IIIT Allahabad IT", rank: 11000 },
            { name: "MNNIT / VNIT Core", rank: 28000 },
            { name: "Newer IIITs / Mid NITs", rank: 45000 },
            { name: "Top GFTIs / State Govt", rank: 75000 }
        ];

        const list = document.getElementById('collegeList');
        list.innerHTML = "<label>Estimated Availability</label>";

        db.forEach(col => {
            let effectiveClosingRank = col.rank * catMultiplier;
            let ratio = crl / effectiveClosingRank;
            
            let status = "", badge = "";
            if (ratio <= 0.6) { status = "Safe"; badge = "badge-safe"; }
            else if (ratio <= 1.0) { status = "Target"; badge = "badge-target"; }
            else if (ratio <= 1.3) { status = "Dream"; badge = "badge-dream"; }

            if (status) {
                list.innerHTML += `
                    <div class="college-item">
                        <span style="font-size:0.85rem; font-weight:600;">${col.name}</span>
                        <span class="badge ${badge}">${status}</span>
                    </div>`;
            }
        });
    }
</script>
</body>
</html>
