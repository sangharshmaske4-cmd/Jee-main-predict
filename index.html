<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JEE 2026 Predictor | Gold Edition</title>
    <style>
        :root { --p: #4f46e5; --s: #10b981; --w: #f59e0b; --bg: #f1f5f9; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); padding: 15px; margin: 0; }
        .app-container { max-width: 500px; margin: 20px auto; background: white; border-radius: 30px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .hero { background: linear-gradient(135deg, #1e293b, #334155); color: white; padding: 20px; border-radius: 20px; text-align: center; margin-bottom: 20px; }
        .input-box { margin-bottom: 15px; }
        label { font-size: 0.8rem; font-weight: 700; color: #64748b; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 15px; box-sizing: border-box; font-size: 1rem; }
        .btn { width: 100%; background: var(--p); color: white; border: none; padding: 18px; border-radius: 18px; font-weight: 800; font-size: 1.1rem; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn:hover { background: #4338ca; transform: translateY(-2px); }
        .res-card { border: 1.5px solid #e2e8f0; border-radius: 20px; padding: 15px; margin-top: 15px; transition: 0.3s; position: relative; overflow: hidden; }
        .res-card::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 5px; background: var(--p); }
        .type-tag { font-size: 0.6rem; font-weight: 900; padding: 3px 8px; border-radius: 5px; text-transform: uppercase; margin-bottom: 5px; display: inline-block; }
        .nit { background: #fee2e2; color: #ef4444; } .iiit { background: #e0f2fe; color: #0ea5e9; }
        .chance { font-weight: 900; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="hero">
        <h2 style="margin:0">Predictor Gold v5.2</h2>
        <p id="rank-text" style="margin:5px 0 0; font-size: 0.9rem; opacity: 0.8;">Enter details to see rank</p>
    </div>

    <div class="input-box">
        <label>JEE MAIN PERCENTILE</label>
        <input type="number" id="p" placeholder="e.g. 85.5" step="0.01">
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <div class="input-box">
            <label>CATEGORY</label>
            <select id="c">
                <option value="GEN">General</option>
                <option value="OBC">OBC-NCL</option>
                <option value="SC">SC</option>
                <option value="ST">ST</option>
            </select>
        </div>
        <div class="input-box">
            <label>HOME STATE</label>
            <select id="s">
                <option value="Maharashtra">Maharashtra</option>
                <option value="Delhi">Delhi</option>
                <option value="Other">Other State</option>
            </select>
        </div>
    </div>

    <button class="btn" onclick="go()">Predict My Colleges</button>

    <div id="out"></div>
</div>

<script>
const db = [
    { n: "NIT Trichy", b: "CSE", s: "Tamil Nadu", t: "NIT", c: { GEN: {o: 1500, h: 5000}, SC: {o: 400, h: 1200} } },
    { n: "NIT Nagpur (VNIT)", b: "Electronics", s: "Maharashtra", t: "NIT", c: { GEN: {o: 9000, h: 11000}, SC: {o: 1800, h: 3200} } },
    { n: "NIT Nagaland", b: "Civil", s: "Nagaland", t: "NIT", c: { GEN: {o: 52000, h: 420000}, SC: {o: 8500, h: 92000} } },
    { n: "IIIT Guwahati", b: "CSE", s: "Assam", t: "IIIT", c: { GEN: {o: 21000, h: 21000} } },
    { n: "RCOEM Nagpur", b: "IT/CS", s: "Maharashtra", t: "GFTI", c: { GEN: {o: 35000, h: 45000}, SC: {o: 45000, h: 260000} } },
    { n: "GFTI Mizoram", b: "ECE", s: "Mizoram", t: "GFTI", c: { GEN: {o: 82000, h: 720000}, SC: {o: 14000, h: 170000} } }
];

function go() {
    const p = parseFloat(document.getElementById('p').value);
    const cat = document.getElementById('c').value;
    const hState = document.getElementById('s').value;
    
    if(!p) return;
    
    // 16L candidates safety formula
    let r = Math.floor((100 - p) * 16000);
    document.getElementById('rank-text').innerText = `Estimated CRL: ~${r.toLocaleString()}`;

    let hits = db.filter(col => {
        let q = col.s === hState ? 'h' : 'o';
        let cut = col.c[cat]?.[q] || col.c['GEN']?.[q];
        return cut && r <= (cut * 1.5);
    });

    // Proximity sorting
    hits.sort((a,b) => {
        let qA = a.s === hState ? 'h' : 'o';
        let qB = b.s === hState ? 'h' : 'o';
        return (r / (a.c[cat]?.[qA] || a.c['GEN']?.[qA])) - (r / (b.c[cat]?.[qB] || b.c['GEN']?.[qB]));
    });

    let html = "";
    hits.forEach(h => {
        let q = h.s === hState ? 'h' : 'o';
        let cut = h.c[cat]?.[q] || h.c['GEN']?.[q];
        let safe = r <= cut;
        html += `
            <div class="res-card">
                <span class="type-tag ${h.t.toLowerCase()}">${h.t}</span>
                <div style="display:flex; justify-content:space-between">
                    <b>${h.n}</b>
                    <span class="chance" style="color:${safe?'var(--s)':'var(--w)'}">${safe?'Safe':'CSAB'}</span>
                </div>
                <div style="font-size:0.8rem; color:#64748b; margin-top:5px;">
                    ${h.b} | Cutoff: ${cut.toLocaleString()} (${q.toUpperCase()})
                </div>
            </div>`;
    });
    document.getElementById('out').innerHTML = html || "<p style='text-align:center'>No options found. Try CSAB rounds.</p>";
}
</script>
</body>
</html>
