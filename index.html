<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEE Predictor</title>

<style>
body {
  font-family: system-ui;
  background: #eef3f8;
  padding: 20px;
}

.card {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

h2 {
  text-align: center;
}

input, select, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 15px;
}

button {
  background: #1e3a4d;
  color: white;
  font-weight: bold;
}

.result {
  margin-top: 20px;
  padding: 15px;
  background: #f5f8fb;
  border-radius: 10px;
}

.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  margin-left: 5px;
}

.safe { background: #d9f0f5; }
.target { background: #fff0db; }
.dream { background: #ffe0d6; }
</style>
</head>

<body>

<div class="card">
  <h2>🎯 JEE College Predictor</h2>

  <input type="number" id="marks" placeholder="Enter Marks (0-300)">

  <select id="category">
    <option>General</option>
    <option>OBC</option>
    <option>SC</option>
    <option>ST</option>
  </select>

  <button onclick="predict()">Predict Colleges</button>

  <div id="result" class="result"></div>
</div>

<script>

// ---------- MARKS → RANK ----------
function marksToRank(m) {
  m = Number(m);
  if (m >= 300) return 1;

  let percentile = (m / 300) * 100;
  let total = 1500000;

  return Math.round(total * (100 - percentile) / 100);
}

// ---------- COLLEGE LOGIC ----------
function getColleges(rank) {

  if(rank <= 3000) {
    return [
      ["NIT Trichy - CSE","safe"],
      ["NIT Surathkal - CSE","safe"],
      ["IIIT Hyderabad","target"]
    ];
  }

  if(rank <= 10000) {
    return [
      ["NIT Warangal - ECE","safe"],
      ["NIT Surathkal - ECE","target"],
      ["IIIT Bangalore","dream"]
    ];
  }

  if(rank <= 30000) {
    return [
      ["NIT Bhopal - Mechanical","safe"],
      ["NIT Calicut - Electrical","target"],
      ["IIIT Jabalpur","dream"]
    ];
  }

  if(rank <= 80000) {
    return [
      ["NIT Patna","safe"],
      ["NIT Raipur","safe"],
      ["NIT Silchar","target"]
    ];
  }

  return [
    ["GFTI Colleges","safe"],
    ["State Govt Colleges","target"]
  ];
}

// ---------- MAIN FUNCTION ----------
function predict() {

  let marks = document.getElementById("marks").value;
  let category = document.getElementById("category").value;

  if(!marks) {
    alert("Enter marks");
    return;
  }

  let rank = marksToRank(marks);

  // category advantage
  if(category === "OBC") rank *= 1.2;
  if(category === "SC") rank *= 1.5;
  if(category === "ST") rank *= 1.8;

  rank = Math.round(rank);

  let colleges = getColleges(rank);

  let html = `
    <h3>📊 Estimated Rank: ${rank}</h3>
    <h4>🎓 Colleges:</h4>
    <ul>
  `;

  colleges.forEach(c => {
    html += `<li>${c[0]} <span class="badge ${c[1]}">${c[1]}</span></li>`;
  });

  html += "</ul>";

  document.getElementById("result").innerHTML = html;
}

</script>

</body>
</html>
