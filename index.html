<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JEE Predictor Pro</title>
<style>
    body{
        margin:0;
        font-family: system-ui, Arial;
        background:#0f172a;
        color:white;
    }

    .app{
        max-width:420px;
        margin:auto;
        padding:20px;
    }

    .header{
        text-align:center;
        margin:20px 0;
    }

    .header h1{
        margin:0;
        font-size:22px;
    }

    .header p{
        margin:5px 0;
        font-size:12px;
        opacity:0.7;
    }

    .card{
        background:#111c33;
        padding:15px;
        border-radius:14px;
        margin-top:12px;
        border:1px solid #1e293b;
    }

    input, select{
        width:100%;
        padding:12px;
        margin-top:10px;
        border-radius:10px;
        border:none;
        background:#1e293b;
        color:white;
        outline:none;
    }

    button{
        width:100%;
        margin-top:12px;
        padding:12px;
        border:none;
        border-radius:10px;
        background:#4f46e5;
        color:white;
        font-weight:600;
        cursor:pointer;
    }

    .result{
        margin-top:15px;
    }

    .item{
        background:#0b1220;
        padding:12px;
        border-radius:12px;
        margin-top:10px;
        border-left:3px solid #4f46e5;
    }

    .tag{
        font-size:11px;
        padding:2px 8px;
        border-radius:6px;
        background:#1e293b;
        display:inline-block;
        margin-bottom:6px;
    }

    .safe{color:#22c55e;font-weight:700;}
    .mid{color:#f59e0b;font-weight:700;}

</style>
</head>
<body>

<div class="app">

    <div class="header">
        <h1>🎯 JEE Predictor Pro</h1>
        <p>Clean • Fast • Simple Analysis</p>
    </div>

    <div class="card">
        <input type="number" id="rank" placeholder="Enter CRL Rank">
        
        <select id="state">
            <option>Home State</option>
            <option>Other State</option>
        </select>

        <button onclick="run()">Predict Colleges</button>
    </div>

    <div class="result" id="out"></div>

</div>

<script>

const colleges = [
    {name:"NIT Trichy CSE", cutoff:1500},
    {name:"NIT Surathkal CSE", cutoff:1800},
    {name:"VNIT Nagpur ECE", cutoff:9500},
    {name:"NIT Raipur IT", cutoff:19000},
    {name:"IIIT Guwahati CSE", cutoff:22000},
    {name:"GFTI Mizoram", cutoff:85000}
];

function run(){
    let rank = parseInt(document.getElementById("rank").value);
    let out = document.getElementById("out");

    if(!rank){
        out.innerHTML = "<div class='item'>Enter valid rank</div>";
        return;
    }

    let res = colleges
        .filter(c => rank <= c.cutoff * 1.6)
        .sort((a,b)=>a.cutoff-b.cutoff);

    let html="";

    res.forEach(c=>{
        let safe = rank <= c.cutoff;

        html += `
        <div class="item">
            <div class="tag">College</div>
            <div><b>${c.name}</b></div>
            <div class="${safe?'safe':'mid'}">
                ${safe ? "High Chance" : "Moderate Chance"}
            </div>
            <small>Cutoff ~ ${c.cutoff}</small>
        </div>
        `;
    });

    out.innerHTML = html || "<div class='item'>No matches found</div>";
}

</script>

</body>
</html>
