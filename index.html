<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictor Pro v4.5 | Sangharsh Maske</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --border: #dbe4ee;
            --bg-start: #f8fbff;
            --bg-end: #eef4ff;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            color: var(--primary);
        }

        .brand-header {
            text-align: center;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.22em;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .container {
            background: white;
            padding: 32px;
            border-radius: 24px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 14px 40px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .header { text-align: center; margin-bottom: 32px; }
        .header h1 { 
            font-size: 1.9rem; 
            margin: 0; 
            font-weight: 800; 
            letter-spacing: -0.03em; 
            color: var(--primary);
        }
        .header p { color: #64748b; font-size: 0.95rem; margin-top: 8px; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .full-width { grid-column: span 2; }
        
        label { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 8px; color: #475569; text-transform: uppercase; letter-spacing: 0.05em; }

        input, select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #fff;
            color: var(--primary);
        }

        input:focus, select:focus { 
            border-color: var(--accent); 
            outline: none; 
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); 
        }

        button {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.12);
            margin-bottom: 10px;
        }

        button:hover { 
            background: #1e293b; 
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.18);
        }

        .results-area { margin-top: 32px; display: none; }
        
        .stat-banner {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            background: #f1f5f9;
            padding: 20px;
            border-radius: 18px;
        }
        .stat-item { flex: 1; text-align: center; }
        .stat-label { font-size: 0.68rem; color: #64748b; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
        .stat-val { font-size: 1.45rem; font-weight: 800; color: var(--accent); letter-spacing: -0.02em; }

        .college-card {
            background: white;
            padding: 22px;
            margin-bottom: 16px;
            border-radius: 18px;
            border: 1px solid var(--border);
            border-left: 6px solid #cbd5e1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .college-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.04); }

        .col-info h3 { margin: 0; font-size: 1.1rem; font-weight: 700; color: var(--primary); }
        .col-info p { margin: 6px 0 0; font-size: 0.88rem; color: #64748b; font-weight: 500; }
        
        .col-stats { text-align: right; min-width: 120px; }
        .badge { font-size: 0.7rem; padding: 5px 12px; border-radius: 8px; font-weight: 800; text-transform: uppercase; display: inline-block; margin-bottom: 10px; }
        
        .b-vsafe { background: #dcfce7; color: #16a34a; }
        .b-safe { background: #dbeafe; color: #1d4ed8; }
        .b-target { background: #fef3c7; color: #b45309; }
        .b-dream { background: #fee2e2; color: #dc2626; }

        .closing-rank { font-size: 0.8rem; font-family: 'JetBrains Mono', monospace; color: #94a3b8; font-weight: 600; }

        #loader { display: none; text-align: center; margin: 30px 0; }
        .spinner { width: 32px; height: 32px; border: 3px solid #f3f3f3; border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .empty-state { text-align: center; padding: 50px; color: #64748b; border: 2.5px dashed var(--border); border-radius: 20px; font-size: 0.95rem; }
        
        .disclaimer { font-size: 0.7rem; color: #94a3b8; text-align: center; margin-top: 20px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">SANGHARSH MASKE</div>
    <div class="header">
        <h1>Predictor Pro v4.5</h1>
        <p>JEE 2026 Advanced Analytics Engine</p>
    </div>

    <div class="form-grid">
        <div>
            <label>Input Mode</label>
            <select id="mode" onchange="updateUI()">
                <option value="marks">NTA Score (Marks)</option>
                <option value="rank">CRL Rank</option>
            </select>
        </div>
        <div>
            <label id="inputLabel">Marks (0-300)</label>
            <input type="number" id="val" placeholder="e.g. 45">
        </div>
        <div>
            <label>Category</label>
            <select id="cat">
                <option value="GEN">General</option>
                <option value="OBC">OBC-NCL</option>
                <option value="SC">SC</option>
                <option value="ST">ST</option>
                <option value="EWS">EWS</option>
            </select>
        </div>
        <div>
            <label>Home State</label>
            <select id="state">
                <option value="">Other State (OS)</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Telangana">Telangana</option>
                <option value="Rajasthan">Rajasthan</option>
                <option value="Maharashtra">Maharashtra</option>
                <option value="Uttar Pradesh">Uttar Pradesh</option>
                <option value="Kerala">Kerala</option>
                <option value="Odisha">Odisha</option>
            </select>
        </div>
        <div class="full-width">
            <label>Preferred Branch</label>
            <select id="branch">
                <option value="All">Show All Available</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Electronics">Electronics</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Mechanical">Mechanical</option>
                <option value="Civil">Civil</option>
            </select>
        </div>
    </div>

    <button onclick="calculate()">Analyze My Chances</button>

    <div id="loader"><div class="spinner"></div></div>

    <div class="results-area" id="results">
        <div class="stat-banner">
            <div class="stat-item">
                <div class="stat-label">Percentile</div>
                <div id="outP" class="stat-val">-</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">CRL Rank</div>
                <div id="outR" class="stat-val">-</div>
            </div>
        </div>
        <div id="list"></div>
        <div class="disclaimer">
            Predictions based on 2026 inflation trends & 1.6M candidates.<br>
            Always verify with official JoSAA seat matrix.
        </div>
    </div>
</div>

<script>
    const TOTAL_CANDIDATES = 1600000;

    const collegeDB = [
        { name: "NIT Tiruchirappalli", state: "Tamil Nadu", branch: "Computer Science", cutoffs: { GEN: { os: 1400, hs: 5000 }, OBC: { os: 800, hs: 2800 }, SC: { os: 500, hs: 1800 }, ST: { os: 300, hs: 900 }}},
        { name: "NIT Surathkal", state: "Karnataka", branch: "Computer Science", cutoffs: { GEN: { os: 2000, hs: 3500 }, OBC: { os: 900, hs: 2000 }, SC: { os: 700, hs: 1400 }}},
        { name: "NIT Warangal", state: "Telangana", branch: "Computer Science", cutoffs: { GEN: { os: 2500, hs: 4000 }, OBC: { os: 1200, hs: 2500 }, SC: { os: 1000, hs: 2000 }}},
        { name: "NIT Calicut", state: "Kerala", branch: "Electronics", cutoffs: { GEN: { os: 10000, hs: 9000 }, OBC: { os: 4500, hs: 3500 }}},
        { name: "MNIT Jaipur", state: "Rajasthan", branch: "Computer Science", cutoffs: { GEN: { os: 4500, hs: 6500 }, OBC: { os: 2200, hs: 4000 }}},
        { name: "NIT Rourkela", state: "Odisha", branch: "Mechanical", cutoffs: { GEN: { os: 22000, hs: 35000 }, SC: { os: 6000, hs: 12000 }}},
        { name: "IIIT Allahabad", state: "Uttar Pradesh", branch: "Information Technology", cutoffs: { GEN: { os: 6000, hs: 6000 }, OBC: { os: 2500, hs: 2500 }}}
    ];

    function updateUI() {
        const mode = document.getElementById('mode').value;
        document.getElementById('inputLabel').innerText = mode === 'marks' ? 'Marks (0-300)' : 'CRL Rank';
    }

    function getPercentile(m) {
        if (m >= 280) return 99.98;
        if (m >= 240) return 99.7;
        if (m >= 180) return 98.8;
        if (m >= 100) return 95.5;
        if (m >= 45)  return 75.0 + (m - 45) * 0.35; // Target: 45 Marks = 75%ile
        return Math.max(0, m * 1.66);
    }

    function calculate() {
        const mode = document.getElementById('mode').value;
        const valInput = parseFloat(document.getElementById('val').value);
        const userCat = document.getElementById('cat').value;
        const userState = document.getElementById('state').value;
        const userBranch = document.getElementById('branch').value;

        if (isNaN(valInput) || valInput < 0) return alert("Enter valid value");

        document.getElementById('loader').style.display = 'block';
        document.getElementById('results').style.display = 'none';

        setTimeout(() => {
            let p, crl;
            if (mode === 'marks') {
                p = getPercentile(valInput);
                crl = Math.round(((100 - p) * TOTAL_CANDIDATES) / 100);
            } else {
                crl = valInput;
                p = 100 - (crl / TOTAL_CANDIDATES * 100);
            }

            document.getElementById('outP').innerText = p.toFixed(2) + "%";
            document.getElementById('outR').innerText = crl.toLocaleString();

            // Category Rank Multipliers (Industry Standard Estimates)
            let catRank = crl;
            if (userCat === "OBC") catRank = Math.round(crl * 0.28);
            if (userCat === "SC") catRank = Math.round(crl * 0.06);
            if (userCat === "ST") catRank = Math.round(crl * 0.02);
            if (userCat === "EWS") catRank = Math.round(crl * 0.12);

            let matches = [];
            collegeDB.forEach(col => {
                if (userBranch !== "All" && col.branch !== userBranch) return;
                const quota = (userState === col.state) ? 'hs' : 'os';
                const cutoff = col.cutoffs[userCat] ? col.cutoffs[userCat][quota] : col.cutoffs['GEN'][quota];
                if (!cutoff) return;

                const ratio = catRank / cutoff;
                if (ratio <= 1.3) matches.push({ ...col, cutoff, ratio });
            });

            matches.sort((a, b) => a.ratio - b.ratio);
            const listDiv = document.getElementById('list');
            listDiv.innerHTML = "";

            if (matches.length === 0) {
                listDiv.innerHTML = `<div class="empty-state">No matching colleges found. Try changing your branch preference.</div>`;
            } else {
                matches.forEach(m => {
                    let badge = "b-dream", status = "Dream", bCol = "#cbd5e1";
                    if (m.ratio <= 0.75) { badge = "b-vsafe"; status = "Very Safe"; bCol = "var(--success)"; }
                    else if (m.ratio <= 0.95) { badge = "b-safe"; status = "Safe"; bCol = "var(--accent)"; }
                    else if (m.ratio <= 1.05) { badge = "b-target"; status = "Target"; bCol = "var(--warning)"; }

                    listDiv.innerHTML += `
                        <div class="college-card" style="border-left-color: ${bCol}">
                            <div class="col-info">
                                <h3>${m.name}</h3>
                                <p>${m.branch} • ${m.state}</p>
                            </div>
                            <div class="col-stats">
                                <div class="badge ${badge}">${status}</div>
                                <div class="closing-rank">${userCat} Rank: ${m.cutoff.toLocaleString()}</div>
                            </div>
                        </div>`;
                });
            }
            document.getElementById('loader').style.display = 'none';
            document.getElementById('results').style.display = 'block';
        }, 600);
    }

    document.getElementById('val').addEventListener('keypress', e => { if (e.key === 'Enter') calculate(); });
</script>
</body>
</html>
