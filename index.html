<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN | JEE Strategic Engine</title>
    <style>
        :root { 
            --neon-blue: #38bdf8; 
            --titan-dark: #020617; 
            --panel-bg: #0f172a;
            --border-glow: rgba(56, 189, 248, 0.2);
        }
        
        body { 
            background-color: var(--titan-dark); 
            color: #f1f5f9; 
            font-family: 'Outfit', 'Inter', sans-serif;
            display: flex; justify-content: center; min-height: 100vh; margin: 0; padding: 20px;
        }

        .engine-container {
            width: 100%; max-width: 500px; background: var(--panel-bg);
            border: 1px solid var(--border-glow); border-radius: 24px;
            padding: 32px; box-shadow: 0 0 40px rgba(0,0,0,0.5);
            position: relative; overflow: hidden;
        }

        /* Futuristic Header Decor */
        .engine-container::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .system-id { font-family: monospace; font-size: 0.7rem; color: var(--neon-blue); letter-spacing: 2px; }

        h1 { font-size: 1.8rem; margin: 0; font-weight: 800; letter-spacing: -1px; }
        p.subtitle { color: #94a3b8; font-size: 0.85rem; margin: 5px 0 0 0; }

        .input-stack { display: flex; flex-direction: column; gap: 20px; margin-top: 30px; }
        
        .field-group { position: relative; }
        label { font-size: 0.65rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 8px; }

        input, select {
            width: 100%; background: #1e293b; border: 1px solid #334155; 
            padding: 14px 16px; border-radius: 12px; color: white; font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus { outline: none; border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(56, 189, 248, 0.15); }

        .btn-simulate {
            width: 100%; padding: 18px; background: var(--neon-blue); color: var(--titan-dark);
            border: none; border-radius: 14px; font-weight: 800; font-size: 1rem;
            cursor: pointer; margin-top: 10px; transition: transform 0.2s;
        }

        .btn-simulate:active { transform: scale(0.98); }

        /* Output Styling */
        .display-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 30px; display: none; }
        .data-point { background: #1e293b; padding: 15px; border-radius: 16px; border: 1px solid #334155; }
        .data-val { font-size: 1.3rem; font-weight: 800; display: block; }
        .data-lbl { font-size: 0.6rem; color: #94a3b8; text-transform: uppercase; }

        .college-result { 
            background: rgba(255,255,255,0.02); margin-top: 12px; padding: 16px;
            border-radius: 16px; border-left: 4px solid var(--neon-blue);
        }
        .status-tag { font-size: 0.6rem; padding: 2px 8px; border-radius: 20px; font-weight: 900; background: #38bdf822; color: var(--neon-blue); }
    </style>
</head>
<body>

<div class="engine-container">
    <div class="top-bar">
        <span class="system-id">ENGINE: TITAN_v4.5</span>
        <span class="system-id">CORE: ACTIVE</span>
    </div>

    <div class="header">
        <h1>Predictor Pro</h1>
        <p class="subtitle">Advanced Seat Allocation Engine &copy; 2026</p>
    </div>

    <div class="input-stack">
        <div class="field-group">
            <label>NTA Score (Marks)</label>
            <input type="number" id="marks" placeholder="0 - 300">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div>
                <label>Category</label>
                <select id="cat">
                    <option value="GEN">General</option>
                    <option value="OBC">OBC-NCL</option>
                    <option value="SC">SC</option>
                    <option value="ST">ST</option>
                </select>
            </div>
            <div>
                <label>Home State</label>
                <select id="state">
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>
    </div>

    <button class="btn-simulate" onclick="calculate()">INITIALIZE SIMULATION</button>

    <div class="display-grid" id="statPanel">
        <div class="data-point">
            <span class="data-lbl">Percentile</span>
            <span class="data-val" id="resP" style="color: var(--neon-blue);">--</span>
        </div>
        <div class="data-point">
            <span class="data-lbl">CRL Rank</span>
            <span class="data-val" id="resR">--</span>
        </div>
    </div>

    <div id="results" style="margin-top:20px;"></div>
</div>

<script>
    // Keeping your DB and Logic intact as they are "Important"
    const db = [
        { n: "NIT Trichy", b: "CSE", s: "Tamil Nadu", c: { GEN: {os: 1500, hs: 5000}, SC: {os: 450, hs: 1100} } },
        { n: "NIT Nagpur (VNIT)", b: "Electronics", s: "Maharashtra", c: { GEN: {os: 9500, hs: 12500}, SC: {os: 1600, hs: 3200} } },
        { n: "NIT Nagaland", b: "Civil", s: "Nagaland", c: { GEN: {os: 55000, hs: 450000}, SC: {os: 8000, hs: 95000} } },
        { n: "GFTI Mizoram", b: "ECE", s: "Mizoram", c: { GEN: {os: 85000, hs: 750000}, SC: {os: 15000, hs: 175000} } },
        { n: "RCOEM Nagpur", b: "CSE/IT", s: "Maharashtra", c: { GEN: {os: 40000, hs: 55000}, SC: {os: 45000, hs: 320000} } }
    ];

    function calculate() {
        const m = parseFloat(document.getElementById('marks').value);
        const cat = document.getElementById('cat').value;
        const hState = document.getElementById('state').value;
        if(!m && m !== 0) return;

        let p = (m >= 100) ? 95.8 : (m >= 45) ? (73.5 + (m - 45) * 0.4).toFixed(2) : (m * 1.63).toFixed(2);
        let crl = Math.round(((100 - p) * 1600000) / 100);

        document.getElementById('statPanel').style.display = 'grid';
        document.getElementById('resP').innerText = p + "%";
        document.getElementById('resR').innerText = crl.toLocaleString();

        let catRank = (cat === "SC") ? crl * 0.055 : (cat === "OBC") ? crl * 0.28 : crl;
        let html = "";

        db.forEach(col => {
            let q = (col.s === hState) ? 'hs' : 'os';
            let cut = col.c[cat]?.[q] || col.c['GEN'][q];
            if(catRank / cut < 1.5) {
                html += `
                    <div class="college-result">
                        <span class="status-tag">${catRank <= cut ? 'HIGH PROBABILITY' : 'CSAB TARGET'}</span>
                        <div style="font-weight:700; margin-top:8px;">${col.n}</div>
                        <div style="font-size:0.8rem; color:#94a3b8;">${col.b} (${q.toUpperCase()} QUOTA)</div>
                    </div>`;
            }
        });
        document.getElementById('results').innerHTML = html;
    }
</script>
</body>
</html>
