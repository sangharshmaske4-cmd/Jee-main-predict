<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JEE Predictor v5.2 | Strategic Counselor</title>
    <style>
        :root { --p: #4f46e5; --s: #10b981; --warn: #f59e0b; --bg: #f8fafc; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); padding: 15px; color: #1e293b; }
        .card { background: white; border-radius: 24px; padding: 25px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        input, select { padding: 12px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 0.95rem; outline: none; transition: 0.3s; width: 100%; box-sizing: border-box; }
        input:focus { border-color: var(--p); }
        .btn-predict { width: 100%; background: var(--p); color: white; border: none; padding: 16px; border-radius: 14px; font-weight: 700; cursor: pointer; font-size: 1.1rem; margin-bottom: 10px; }
        #stats-panel { background: #1e293b; color: white; padding: 20px; border-radius: 20px; margin-bottom: 20px; text-align: center; display: none; }
        .result-card { border: 1.5px solid #e2e8f0; border-radius: 18px; padding: 15px; margin-bottom: 12px; transition: 0.2s; }
        .result-card:hover { border-color: var(--p); transform: translateY(-2px); }
        .badge { font-size: 0.65rem; padding: 4px 8px; border-radius: 6px; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; display: inline-block; }
        .nit { background: #fee2e2; color: #ef4444; } .iiit { background: #e0f2fe; color: #0ea5e9; } .gfti { background: #fef3c7; color: #d97706; }
        .reasoning { font-size: 0.8rem; margin-top: 8px; padding: 8px; background: #f1f5f9; border-radius: 8px; color: #475569; border-left: 3px solid var(--p); }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align:center; margin-bottom:20px;">JEE 2026 Predictor <span style="font-size:0.8rem; vertical-align:middle; color:var(--p)">v5.2 PRO</span></h2>
    
    <div id="stats-panel">
        <div id="rank-display" style="font-size: 1.6rem; font-weight: 900;"></div>
        <div id="percentile-range" style="font-size: 0.8rem; opacity: 0.7;"></div>
    </div>

    <div class="input-grid">
        <input type="number" id="percentile" placeholder="Percentile" step="0.01">
        <select id="category">
            <option value="GEN">General</option>
            <option value="OBC">OBC-NCL</option>
            <option value="SC">SC</option>
            <option value="ST">ST</option>
        </select>
        <select id="state">
            <option value="Maharashtra">Maharashtra</option>
            <option value="Delhi">Delhi</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="Other">Other State</option>
        </select>
        <select id="branch-group">
            <option value="All">All Branches</option>
            <option value="Circuit">Circuit (CS/IT/EC)</option>
            <option value="Core">Core (Mech/Civil)</option>
        </select>
    </div>

    <button class="btn-predict" onclick="predict()">View Best Options</button>
    <div id="results-list"></div>
    <button id="wa-btn" onclick="shareWA()" style="display:none; background:#25D366; width:100%; border:none; padding:12px; border-radius:12px; color:white; font-weight:700; cursor:pointer;">Share on WhatsApp</button>
</div>

<script>
const collegeDB = [
    { name: "NIT Trichy", branch: "CSE", state: "Tamil Nadu", type: "NIT", group: "Circuit", cutoffs: { GEN: {os: 1500, hs: 5000}, SC: {os: 400, hs: 1200} } },
    { name: "NIT Nagpur (VNIT)", branch: "ECE", state: "Maharashtra", type: "NIT", group: "Circuit", cutoffs: { GEN: {os: 9500, hs: 12000}, SC: {os: 1800, hs: 3500} } },
    { name: "NIT Nagaland", branch: "Civil", state: "Nagaland", type: "NIT", group: "Core", cutoffs: { GEN: {os: 55000, hs: 450000}, SC: {os: 8000, hs: 95000} } },
    { name: "GFTI Mizoram", branch: "ECE", state: "Mizoram", type: "GFTI", group: "Circuit", cutoffs: { GEN: {os: 85000, hs: 750000} } },
    { name: "RCOEM Nagpur", branch: "CSE", state: "Maharashtra", type: "GFTI", group: "Circuit", cutoffs: { SC: {os: 35000, hs: 280000}, GEN: {os: 25000, hs: 45000} } }
];

function predict() {
    const perc = parseFloat(document.getElementById('percentile').value);
    const cat = document.getElementById('category').value;
    const userState = document.getElementById('state').value;
    const groupFilter = document.getElementById('branch-group').value;
    
    if(!perc) return;

    // 16L candidates for 2026 safety + jitter
    let crl = Math.floor((100 - perc) * 16000);
    crl += Math.floor(Math.random() * 400) - 200;
    
    document.getElementById('stats-panel').style.display = 'block';
    document.getElementById('rank-display').innerText = `CRL Rank: ~${crl.toLocaleString()}`;
    document.getElementById('percentile-range').innerText = `Range: ${perc-0.2}% - ${perc+0.2}%`;

    let results = collegeDB.filter(col => {
        if(groupFilter !== "All" && col.group !== groupFilter) return false;
        
        const quota = col.state === userState ? 'hs' : 'os';
        // Bugfix 1: Optional chaining + GEN fallback
        const cutoff = col.cutoffs[cat]?.[quota] || col.cutoffs['GEN']?.[quota];
        
        if(!cutoff) return false;
        return crl <= (cutoff * 1.5); // 1.5x for CSAB buffer
    });

    // Bugfix 3: Proximity Sorting (Lower ratio = Better chance)
    results.sort((a,b) => {
        const getCutoff = (c) => c.cutoffs[cat]?.[c.state === userState ? 'hs':'os'] || c.cutoffs['GEN']?.[c.state === userState ? 'hs':'os'];
        return (crl / getCutoff(a)) - (crl / getCutoff(b));
    });

    display(results, crl, cat, userState);
}

function display(data, crl, cat, userState) {
    const list = document.getElementById('results-list');
    list.innerHTML = data.length ? "" : "<p style='text-align:center; padding:20px;'>No direct matches. Check CSAB Special Rounds later.</p>";
    
    data.forEach(col => {
        const quota = col.state === userState ? 'hs' : 'os';
        const cutoff = col.cutoffs[cat]?.[quota] || col.cutoffs['GEN']?.[quota];
        const chance = crl <= cutoff ? "High" : "Medium (CSAB)";
        
        // Feature Upgrade 2: Reasoning Tooltip
        const reason = crl <= cutoff ? `Safe: Your rank beats the 2025 ${quota.toUpperCase()} closing rank.`
                                     : `CSAB: Historically closes around ${cutoff.toLocaleString()}. High vacancy expected here.`;

        list.innerHTML += `
            <div class="result-card">
                <span class="badge ${col.type.toLowerCase()}">${col.type}</span>
                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                    <div>
                        <h4 style="margin:0;">${col.name}</h4>
                        <p style="margin:4px 0; font-size:0.85rem; color:#64748b;">${col.branch} (${quota.toUpperCase()})</p>
                    </div>
                    <div style="text-align:right">
                        <span style="font-weight:800; color:${chance === 'High' ? 'var(--s)' : 'var(--warn)'}">${chance}</span>
                        <div style="font-size:0.7rem; color:#94a3b8;">Cutoff: ${cutoff.toLocaleString()}</div>
                    </div>
                </div>
                <div class="reasoning">${reason}</div>
            </div>
        `;
    });
    document.getElementById('wa-btn').style.display = 'block';
}

function shareWA() {
    const rank = document.getElementById('rank-display').innerText;
    const text = `Check my JEE 2026 Prediction:\n${rank}\nTop Options: ${[...document.querySelectorAll('h4')].slice(0,2).map(e=>e.innerText).join(', ')}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(text + "\nTry it here: " + window.location.href)}`);
}
</script>
</body>
</html>
