<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE Predictor Pro | 2026 Edition</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(255, 255, 255, 0.98);
            --primary: #2563eb;
            --secondary: #64748b;
            --safe: #10b981;
            --target: #f59e0b;
            --dream: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .predictor-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        header { text-align: center; margin-bottom: 30px; }
        header h1 { margin: 0; font-size: 1.5rem; font-weight: 800; color: #0f172a; }
        header p { margin: 5px 0 0; font-size: 0.85rem; color: var(--secondary); font-weight: 500; }

        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--secondary); margin-bottom: 8px; letter-spacing: 0.5px; }
        
        select, input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        select:focus, input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        button:hover { transform: translateY(-2px); background: #1d4ed8; }

        /* Results Styling */
        .results-section { display: none; margin-top: 30px; border-top: 2px solid #f1f5f9; padding-top: 25px; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-card { background: #f8fafc; padding: 15px; border-radius: 16px; text-align: center; border: 1px solid #e2e8f0; }
        .stat-label { font-size: 0.7rem; font-weight: 700; color: var(--secondary); text-transform: uppercase; }
        .stat-value { font-size: 1.25rem; font-weight: 800; color: var(--primary); }

        .college-list { list-style: none; padding: 0; margin: 0; }
        .college-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            color: white;
            text-transform: uppercase;
        }
        .bg-safe { background: var(--safe); }
        .bg-target { background: var(--target); }
        .bg-dream { background: var(--dream); }

        footer { text-align: center; margin-top: 20px; font-size: 0.7rem; color: #94a3b8; }
    </style>
</head>
<body>

<div class="predictor-card">
    <header>
        <h1>JEE Predictor Pro</h1>
        <p>Advanced 2026 Analysis Engine</p>
    </header>

    <div class="input-group">
        <label>Input Selection</label>
        <select id="inputType" onchange="updateUI()">
            <option value="marks">NTA Marks (0-300)</option>
            <option value="rank">CRL Rank (General)</option>
        </select>
    </div>

    <div class="input-group">
        <label id="dynamicLabel">Enter Marks</label>
        <input type="number" id="mainInput" placeholder="e.g. 185">
    </div>

    <div class="input-group">
        <label>Social Category</label>
        <select id="category">
            <option value="1.0">General / Open</option>
            <option value="3.0">OBC-NCL</option>
            <option value="2.8">Gen-EWS</option>
            <option value="7.2">SC Category</option>
            <option value="10.5">ST Category</option>
        </select>
    </div>

    <button onclick="calculate()">Predict Chances</button>

    <div class="results-section" id="results">
        <div class="stat-grid">
            <div class="stat-card">
                <div class="stat-label">Percentile</div>
                <div class="stat-value" id="resPercentile">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Estimated CRL</div>
                <div class="stat-value" id="resRank">-</div>
            </div>
        </div>

        <label>Admission Probability</label>
        <div id="collegeContainer"></div>
    </div>

    <footer>
        Data normalized for 1.6M unique candidates in 2026.
    </footer>
</div>

<script>
    function updateUI() {
        const type = document.getElementById('inputType').value;
        document.getElementById('dynamicLabel').innerText = type === 'marks' ? 'Enter Marks' : 'Enter CRL Rank';
        document.getElementById('mainInput').placeholder = type === 'marks' ? 'e.g. 185' : 'e.g. 25000';
    }

    // Your Researched 2026 Marks-to-Percentile Logic
    function calculatePercentile(m) {
        if (m >= 290) return 99.99;
        if (m >= 250) return 99.7 + (m - 250) * 0.006;
        if (m >= 200) return 98.2 + (m - 200) * 0.03;
        if (m >= 150) return 95.5 + (m - 150) * 0.06;
        if (m >= 120) return 92 + (m - 120) * 0.12;
        if (m >= 100) return 90 + (m - 100) * 0.1;
        if (m >= 80) return 85 + (m - 80) * 0.25;
        if (m >= 60) return 80 + (m - 60) * 0.25;
        if (m >= 40) return 70 + (m - 40) * 0.5;
        return 50 + m * 0.5;
    }

    function calculate() {
        const type = document.getElementById('inputType').value;
        const inputVal = parseFloat(document.getElementById('mainInput').value);
        const catMultiplier = parseFloat(document.getElementById('category').value);
        const totalCandidates = 1600000;

        if (isNaN(inputVal)) return alert("Please enter a valid value.");

        let crl, percentile;

        if (type === 'marks') {
            percentile = calculatePercentile(inputVal);
            crl = Math.round((100 - percentile) * totalCandidates / 100);
        } else {
            crl = inputVal;
            percentile = 100 - (crl / totalCandidates) * 100;
        }

        // Show Results
        document.getElementById('results').style.display = 'block';
        document.getElementById('resPercentile').innerText = percentile.toFixed(2) + "%";
        document.getElementById('resRank').innerText = crl.toLocaleString();

        // 2026 Mock Database (CRL Closing Ranks for Open Category)
        const colleges = [
            { name: "IIT Top 7 (Advanced Req.)", rank: 3500 },
            { name: "NIT Trichy / Surathkal (CS)", rank: 6500 },
            { name: "IIIT Allahabad (IT)", rank: 11000 },
            { name: "NIT Warangal / Rourkela", rank: 18000 },
            { name: "Top GFTIs (PEC / BIT Mesra)", rank: 35000 },
            { name: "Newer IIITs (CS/IT)", rank: 48000 },
            { name: "Lower NITs (Core Branches)", rank: 65000 },
            { name: "State Govt Colleges", rank: 95000 }
        ];

        const container = document.getElementById('collegeContainer');
        container.innerHTML = "";

        colleges.forEach(col => {
            const effectiveClosingRank = col.rank * catMultiplier;
            const ratio = crl / effectiveClosingRank;

            let status = "", badgeClass = "";

            if (ratio <= 0.6) {
                status = "Safe";
                badgeClass = "bg-safe";
            } else if (ratio <= 1.0) {
                status = "Target";
                badgeClass = "bg-target";
            } else if (ratio <= 1.3) {
                status = "Dream";
                badgeClass = "bg-dream";
            }

            if (status) {
                container.innerHTML += `
                    <div class="college-item">
                        <span style="font-size:0.85rem; font-weight:600; color:#1e293b;">${col.name}</span>
                        <span class="badge ${badgeClass}">${status}</span>
                    </div>
                `;
            }
        });

        if (container.innerHTML === "") {
            container.innerHTML = "<p style='font-size:0.8rem; color:red; text-align:center;'>Rank too high for Top Institutes. Explore Private or CSAB rounds.</p>";
        }
    }
</script>

</body>
</html>
