<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEE College Predictor (Simple)</title>

<style>
body {
  font-family: Arial;
  background: #eef3f8;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 15px;
  max-width: 500px;
  margin: auto;
  box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}

input, select, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button {
  background: #1e3a4d;
  color: white;
  font-weight: bold;
}

.result {
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="card">
  <h2>🎯 JEE College Predictor</h2>

  <input type="number" id="marks" placeholder="Enter Marks (0-300)">
  
  <select id="category">
    <option>General</option>
    <option>OBC</option>
    <option>SC</option>
    <option>ST</option>
  </select>

  <button onclick="predict()">Predict Colleges</button>

  <div class="result" id="result"></div>
</div>

<script>
function marksToRank(marks) {
  if(marks > 250) return 1000;
  if(marks > 200) return 5000;
  if(marks > 150) return 15000;
  if(marks > 100) return 40000;
  if(marks > 50) return 80000;
  return 150000;
}

function predict() {
  let marks = document.getElementById("marks").value;
  let category = document.getElementById("category").value;

  if(!marks) {
    alert("Enter marks");
    return;
  }

  let rank = marksToRank(marks);

  let colleges = [];

  if(rank <= 5000) {
    colleges.push("NIT Trichy - CSE", "NIT Surathkal - CSE");
  } else if(rank <= 15000) {
    colleges.push("NIT Warangal - ECE", "IIIT Hyderabad");
  } else if(rank <= 40000) {
    colleges.push("NIT Bhopal - Mechanical", "IIIT Jabalpur");
  } else {
    colleges.push("NIT Patna", "NIT Raipur", "GFTI Colleges");
  }

  document.getElementById("result").innerHTML = `
    <b>Estimated Rank:</b> ${rank}<br><br>
    <b>Colleges:</b><br> ${colleges.join("<br>")}
  `;
}
</script>

</body>
</html>
